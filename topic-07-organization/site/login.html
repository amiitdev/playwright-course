<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — Shopping App</title>
  <style>
    body { font-family: sans-serif; margin: 40px; max-width: 320px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
    #error { color: #c0392b; display: none; }
    .muted { color: #777; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <p class="muted">Any password works in this demo.</p>

  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password" />

    <p id="error">Wrong credentials</p>
    <button type="submit">Sign in</button>
  </form>

  <p><a href="index.html">← Back to home</a></p>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      if (email && pass) {
        // store email so dashboard can show "logged in"
        localStorage.setItem('email', email);
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
